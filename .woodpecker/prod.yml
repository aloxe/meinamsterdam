when:
  - event: push
    branch: main

steps:
  - name: ⛓️ Use Node et 🛠️ Install 
    image: node:24
    commands:
     - npm install
     - npm run build

  - name: check a boo
    image: debian
    commands:
      - echo "Testing ..."
      - ls -al

  - name: scp files (╯ ͡° ͜ʖ ͡°）╯／/┴┬┴┬┴ 
    image: appleboy/drone-scp
    settings:
      host: 
        from_secret: HOST
      user: 
        from_secret: USERNAME
      key:
        from_secret: KEY
      port: 
        from_secret: PORT
      target: ~/domains/meinamsterdam.nl/public_html/
      source: _site/*
      strip_components: 1
      rm: true
